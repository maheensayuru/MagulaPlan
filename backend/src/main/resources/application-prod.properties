# Production profile for Render. All values injected from Render env vars;
# nothing secret is committed here. Activate with SPRING_PROFILES_ACTIVE=prod
# (Render env var overrides the spring.profiles.active=local default).

# If DB_URL is provided, connect to external MySQL; otherwise fall back safely to in-memory H2 so container never crashes
spring.datasource.url=${DB_URL:jdbc:h2:mem:magulaplan;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Render assigns a random free port via $PORT; fall back to 8080 for local runs.
server.port=${PORT:8080}

# Browser origins allowed to call the API. Comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://magulaplan.netlify.app,https://gentle-cucurucho-a28226.netlify.app,http://magulaplan.infinityfreeapp.com,https://magulaplan.infinityfreeapp.com}
